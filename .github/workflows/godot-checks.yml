name: Godot prototype checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  godot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.6.1
        shell: bash
        run: |
          curl --fail --location --retry 3 --output /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.6.1-stable_linux.x86_64
          echo "GODOT_BIN=/tmp/godot/Godot_v4.6.1-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Import, gameplay regression, visual contracts and two-process networking
        run: bash tools/check_observatory.sh
      - name: Render visual review frames
        run: |
          mkdir -p tools/screenshots
          timeout 240 xvfb-run -a "$GODOT_BIN" --path . --audio-driver Dummy --rendering-method gl_compatibility res://tools/observatory_screenshot.tscn 2>&1 | tee /tmp/sellaris-checks/render.log
          test -s tools/screenshots/observatory_fleet.png
          test -s tools/screenshots/clean_binary.png
          if grep -Eq "SCRIPT ERROR|Shader compilation failed" /tmp/sellaris-checks/render.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: godot-review
          path: |
            /tmp/sellaris-checks/*.log
            tools/screenshots/*.png
