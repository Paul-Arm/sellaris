<style>

spacing:-.4px}#astral-colony .ac-feature{color:var(--ac-mint);font-size:12px;margin-bottom:23px}#astral-colony .ac-separator{height:1px;background:var(--ac-line);margin:18px 0}#astral-colony .ac-sectionhead{display:flex;justify-content:space-between;gap:8px;color:var(--ac-muted);font-size:10px;letter-spacing:1.4px;margin-bottom:11px}#astral-colony .ac-district{display:flex;align-items:center;gap:9px;width:100%;padding:10px 0;border-bottom:1px solid var(--ac-line);font-size:12px}#astral-colony .ac-district .ac-district-symbol{color:var(--ac-purple);width:20px;text-align:center;font-size:16px}#astral-colony .ac-district small{margin-left:auto;color:var(--ac-muted);font-size:11px}#astral-colony .ac-district button{font-size:14px;padding:0;border:0;width:22px;height:26px;color:var(--ac-muted)}#astral-colony .ac-empty{border:1px dashed #7e88a338;border-radius:3px;height:37px;display:grid;place-items:center;color:#6d7890;margin-top:7px}#astral-colony .ac-popdots{display:flex;gap:5px;flex-wrap:wrap;margin:13px 0 9px}#astral-colony .ac-popdot{width:12px;height:16px;border-radius:6px 6px 2px 2px;background:var(--ac-mint)}#astral-colony .ac-popdot.vacant{background:transparent;border:1px solid #71819877}#astral-colony .ac-popcaption{font-size:11px;color:var(--ac-muted)}#astral-colony .ac-build{width:100%;background:#b8aaf4;color:#131321;margin-top:21px;border-color:#b8aaf4}#astral-colony .ac-build:hover{background:#c7b9fa;color:#131321}#astral-colony .ac-buildchoices{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:17px}#astral-colony .ac-buildchoices button{padding:10px 8px;text-align:left;font-size:12px}#astral-colony .ac-buildchoices small{display:block;font-size:10px;color:var(--ac-muted);margin-top:5px}#astral-colony .ac-popbutton{display:block;width:100%;border:0;color:var(--ac-muted);font-size:11px;margin-top:8px}#astral-colony .ac-note{margin-top:11px;color:var(--ac-mint);font-size:11px;line-height:1.4;min-height:16px}#astral-colony .ac-bottom{padding:13px 22px;border-top:1px solid var(--ac-line);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--ac-muted)}#astral-colony .ac-steps{display:flex;gap:10px;align-items:center}#astral-colony .ac-steps strong{font-weight:400;color:var(--ac-purple);padding:6px 9px;background:#b8aaf416;border-radius:3px}#astral-colony .ac-poprow{display:flex;justify-content:space-between;gap:12px;margin:16px 0;font-size:12px}#astral-colony .ac-poprow span{color:var(--ac-muted)}#astral-colony .ac-policy{display:flex;gap:5px;flex-wrap:wrap}#astral-colony .ac-policy button{font-size:11px;padding:7px 8px}#astral-colony [hidden]{display:none!important}
@container(max-width:750px){#astral-colony .ac-content{grid-template-columns:minmax(0,1fr) 235px}#astral-colony .ac-inspector{padding:20px 15px}#astral-colony .ac-space{aspect-ratio:.78}#astral-colony .ac-heading{left:18px;top:20px}#astral-colony .ac-status{left:18px;right:18px}#astral-colony .ac-marker{width:30px;height:30px}#astral-colony .ac-marker.empty{width:25px;height:25px}}
@container(max-width:560px){#astral-colony .ac-content{grid-template-columns:1fr}#astral-colony .ac-space{aspect-ratio:.95}#astral-colony .ac-inspector{border-left:0;border-top:1px solid var(--ac-line);padding:18px}#astral-colony .ac-top{padding:15px;gap:12px}#astral-colony .ac-brand{font-size:14px}#astral-colony .ac-worldbar{padding:10px 15px}#astral-colony .ac-context{width:100%;margin-bottom:3px}#astral-colony .ac-resources{gap:14px}#astral-colony .ac-worldbar button{flex:1;justify-content:center;padding:7px}#astral-colony .ac-feature{margin-bottom:15px}#astral-colony .ac-build{margin-top:14px}#astral-colony .ac-popdots{margin-top:9px}#astral-colony .ac-marker.selected-tag:before{max-width:125px}#astral-colony .ac-status{font-size:10px}#astral-colony .ac-bottom{padding:12px 15px}}
@media(pointer:coarse){#astral-colony .ac-marker{width:34px;height:34px}#astral-colony .ac-marker:has(span)::after{pointer-events:none}#astral-colony .ac-marker>span:before{content:'';position:absolute;width:44px;height:44px;left:50%;top:50%;transform:translate(-50%,-50%)}#astral-colony .ac-worldbar button,#astral-colony .ac-buildchoices button{min-height:44px}}
</style>
<header class="ac-top"><div class="ac-brand">SINGULARITY<small>PLANETARY COMMAND</small></div><div class="ac-resources" aria-label="Kolonieertrag pro Zyklus"><span class="ac-resource"><b aria-hidden="true">ϟ</b><span id="ac-energy" aria-label="Energie"></span></span><span class="ac-resource"><b aria-hidden="true">◇</b><span id="ac-minerals" aria-label="Mineralien"></span></span><span class="ac-resource"><b aria-hidden="true">⌬</b><span id="ac-science" aria-label="Forschung"></span></span></div></header>
<nav class="ac-worldbar" aria-label="Kolonie auswählen"><span class="ac-context">TERRANISCHE UNION / KOLONIEN</span><button type="button" data-world="0" aria-pressed="true"><i class="ac-mini" aria-hidden="true"></i>Erde</button><button type="button" data-world="1" aria-pressed="false"><i class="ac-mini" style="filter:sepia(.8)" aria-hidden="true"></i>Ares</button><button type="button" data-world="2" aria-pressed="false"><i class="ac-mini" style="filter:hue-rotate(30deg)" aria-hidden="true"></i>Neris</button></nav>
<div class="ac-content"><section class="ac-space" id="ac-space" aria-label="Abstrakte planetare Sektoren"><canvas id="ac-canvas" role="img" aria-label="Planetenkugel mit prozeduralen Sektorgrenzen und Siedlungen"></canvas><div class="ac-heading"><div class="ac-eyebrow" id="ac-eyebrow">SOL III</div><h2 id="ac-worldname">Erde</h2><div class="ac-subtitle" id="ac-worldtype"></div></div><div id="ac-markers"></div><div class="ac-status"><span id="ac-worldpops"></span><span id="ac-sectorcount"></span></div></section>
<aside class="ac-inspector" aria-label="Auswahl"><div id="ac-sectorpanel"><div class="ac-eyebrow" id="ac-sectornumber"></div><h3 id="ac-sectorname"></h3><div class="ac-feature" id="ac-feature"></div><div class="ac-sectionhead"><span>DISTRIKTE</span><span id="ac-used"></span></div><div id="ac-districts"></div><div class="ac-separator"></div><div class="ac-sectionhead"><span>ARBEITSPLÄTZE</span><span id="ac-jobs"></span></div><div id="ac-popdots" class="ac-popdots"></div><div class="ac-popcaption" id="ac-popcaption"></div><button type="button" id="ac-build" class="ac-build">+ Distrikt bauen</button><div id="ac-buildchoices" class="ac-buildchoices" hidden><button type="button" data-build="habitat">⌂ Habitat<small>4 Jobs · 8 Wohnraum</small></button><button type="button" data-build="mine">◇ Mine<small>2 Jobs · Mineralien</small></button><button type="button" data-build="power">ϟ Kraftwerk<small>2 Jobs · Energie</small></button><button type="button" data-build="lab">⌬ Labor<small>2 Jobs · Forschung</small></button></div></div>
<div id="ac-popspanel" hidden><div class="ac-eyebrow">BEVÖLKERUNG</div><h3>18 Pops</h3><div class="ac-feature" id="ac-employment"></div><div class="ac-poprow"><span>Menschen</span><span>12</span></div><div class="ac-poprow"><span>Thalassi</span><span>6</span></div><div class="ac-separator"></div><div class="ac-poprow"><span>Wohnraum</span><span id="ac-housing"></span></div><div class="ac-sectionhead" style="margin-top:23px">JOBPRIORITÄT</div><div class="ac-policy"><button type="button" data-policy="balanced" aria-pressed="true">Ausgewogen</button><button type="button" data-policy="science" aria-pressed="false">Forschung</button></div></div>
<button type="button" class="ac-popbutton" id="ac-popbutton">Bevölkerung ansehen →</button><div class="ac-note" id="ac-note" aria-live="polite"></div></aside></div>
<footer class="ac-bottom"><div class="ac-steps"><span>Galaxie</span><span>›</span><span>System</span><span>›</span><strong>Planet</strong></div><span>Entwurf · Bauen ohne Kosten oder Wartezeit</span></footer>
<script>
(()=>{
 const root=document.getElementById('astral-colony'),$=id=>root.querySelector('#'+id),canvas=$('ac-canvas'),ctx=canvas.getContext('2d');
 const types=[{name:'Erde',system:'SOL III',type:'Kontinentalwelt',habitability:82,tint:[.23,.38,.41],count:9,seed:7341},{name:'Ares',system:'SOL IV',type:'Wüstenwelt',habitability:64,tint:[.48,.32,.25],count:7,seed:28109},{name:'Neris',system:'VEGA II',type:'Ozeanwelt',habitability:91,tint:[.22,.33,.48],count:11,seed:16037}];
 const specs={habitat:{name:'Habitat',symbol:'⌂',jobs:4,key:-1,yield:0},power:{name:'Kraftwerk',symbol:'ϟ',jobs:2,key:0,yield:4},mine:{name:'Mine',symbol:'◇',jobs:2,key:1,yield:3},lab:{name:'Labor',symbol:'⌬',jobs:2,key:2,yield:3}};
 const state={world:0,selected:0,building:false,pops:false,variation:1,contours:true},cache=new Map();let dimensions={w:600,h:536};
 function random(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296;};}
 function generate(t,index){const rand=random(t.seed+state.variation*177),candidates=[];for(let i=0;i<300;i++){const a=rand()*Math.PI*2,r=Math.sqrt(rand())*.79;candidates.push({x:Math.cos(a)*r,y:Math.sin(a)*r});}const pts=[{x:-.24+rand()*.1,y:.17+rand()*.05}];while(pts.length<t.count){let best=null,score=-1;for(const p of candidates){let d=Infinity;for(const s of pts)d=Math.min(d,(p.x-s.x)**2+(p.y-s.y)**2);if(d>score){score=d;best=p;}}pts.push(best);}
   const names=['Zentrum','Nordbogen','Morgenpol','Südbogen','Dämmerzone','Westbogen','Äquator','Ostbogen','Hochzone','Polarkreis','Tiefenzone'];
   const features=index===0?['Fruchtbar','Erzvorkommen','Kristallfeld','Mildes Klima']:index===1?['Geothermie','Erzvorkommen','Strahlungsfeld','Mineraladern']:['Tiefenriff','Hydrothermie','Tiefenerz','Ruhige Strömung'];
   const sites=pts.map((p,i)=>{const feature=features[Math.floor(rand()*features.length)],bonus=/Erz|erz|Mineral/.test(feature)?'mine':/thermie/.test(feature)?'power':/Kristall|riff|Strahlung/.test(feature)?'lab':null;return{...p,z:Math.sqrt(1-p.x*p.x-p.y*p.y),name:i===0?'Hauptstadt':names[i],feature,bonus,slots:i===0?3:2+Math.floor(rand()*2),buildings:i===0?['habitat','power']:i===1?['mine','mine']:i===2?['lab']:[]};});return{sites,type:t,index,policy:'balanced',last:0,pops:18};}
 function world(){const key=state.world+':'+state.variation;if(!cache.has(key))cache.set(key,generate(types[state.world],state.world));return cache.get(key);}
 function economy(w){const all=[];w.sites.forEach((s,i)=>{s.employed=0;s.jobs=0;s.buildings.forEach((b,j)=>{s.jobs+=specs[b].jobs;all.push({i,j,b});});});if(w.policy==='science')all.sort((a,b)=>(b.b==='lab')-(a.b==='lab'));let available=w.pops,housing=16;const yields=[0,0,0];for(const d of all){const s=w.sites[d.i],spec=specs[d.b],n=Math.min(available,spec.jobs);available-=n;s.employed+=n;if(spec.key>=0)yields[spec.key]+=n*spec.yield*(s.bonus===d.b?1.2:1);if(d.b==='habitat')housing+=8;yields[0]-=.5;}return{available,yields,housing};}
 function layout(){const w=dimensions.w,h=dimensions.h,r=Math.min(w*.355,h*.325,Math.max(60,(h-164)/2));return{cx:w*.51,cy:Math.max(h*.55,112+r),r};}
 function paint(){const w=world(),{w:width,h:height}=dimensions,dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#090d16';ctx.fillRect(0,0,width,height);const g=layout(),rng=random(45);
   for(let i=0;i<95;i++){ctx.fillStyle='rgba(157,176,209,'+(.15+rng()*.28)+')';ctx.fillRect(rng()*width,rng()*height,1,1);}
   const glow=ctx.createRadialGradient(g.cx,g.cy,g.r*.65,g.cx,g.cy,g.r*1.6);glow.addColorStop(0,'#9da9e017');glow.addColorStop(1,'#9da9e000');ctx.fillStyle=glow;ctx.fillRect(0,0,width,height);
   // The same restrained contour vocabulary as GalaxyMap, without terrain imagery.
   ctx.save();ctx.translate(g.cx,g.cy);ctx.rotate(-.32);for(let i=0;i<16;i++){ctx.beginPath();ctx.ellipse(0,0,g.r*(1.28+i*.13),g.r*(.66+i*.072),0,0,Math.PI*2);ctx.strokeStyle='rgba(135,133,177,'+(i===0?.15:.034)+')';ctx.lineWidth=.7;ctx.stroke();}ctx.restore();
   const S=440,texture=document.createElement('canvas');texture.width=S;texture.height=S;const tctx=texture.getContext('2d'),im=tctx.createImageData(S,S),owners=new Int16Array(S*S).fill(-1),tint=w.type.tint;
   for(let y=0;y<S;y++)for(let x=0;x<S;x++){const nx=(x+.5-S/2)/(S/2),ny=(y+.5-S/2)/(S/2),r2=nx*nx+ny*ny;if(r2>1)continue;const nz=Math.sqrt(1-r2),p=y*S+x;let best=0,dist=-Infinity;for(let i=0;i<w.sites.length;i++){const s=w.sites[i],d=nx*s.x+ny*s.y+nz*s.z;if(d>dist){dist=d;best=i;}}owners[p]=best;
     const light=Math.max(0,-nx*.42-ny*.5+nz*.76),rim=Math.pow(1-nz,2.8),lat=ny*14,scan=state.contours&&Math.abs((lat-Math.floor(lat))-.5)<.019?1:0;
     for(let c=0;c<3;c++){const base=tint[c]*(.25+light*.65)+[.035,.05,.065][c];const edge=(tint[c]*.45+[.8,.94,1][c]*.55)*rim*.83;let color=base+edge+tint[c]*scan*.075;if(best===state.selected)color+=[.035,.023,.07][c];im.data[p*4+c]=Math.min(255,color*255);}im.data[p*4+3]=Math.min(255,(1-Math.sqrt(r2))*S*255);
   }
   for(let y=1;y<S-1;y++)for(let x=1;x<S-1;x++){const p=y*S+x,o=owners[p];if(o<0)continue;const next=owners[p+1],down=owners[p+S];if((next>=0&&next!==o)||(down>=0&&down!==o)){const active=o===state.selected||next===state.selected||down===state.selected;for(let c=0;c<3;c++)im.data[p*4+c]=Math.round(im.data[p*4+c]*(active?.4:.8)+[184,170,244][c]*(active?.6:.2));}}
   tctx.putImageData(im,0,0);ctx.drawImage(texture,g.cx-g.r,g.cy-g.r,g.r*2,g.r*2);ctx.beginPath();ctx.arc(g.cx,g.cy,g.r+.4,0,Math.PI*2);ctx.strokeStyle='#b9cce138';ctx.lineWidth=.7;ctx.stroke();
   // Surface transport links follow projected great-circle arcs.
   if(state.contours){ctx.strokeStyle='#c2c6e127';ctx.lineWidth=.8;for(let i=1;i<3;i++){const a=w.sites[0],b=w.sites[i];ctx.beginPath();for(let k=0;k<=24;k++){const t=k/24,x=a.x*(1-t)+b.x*t,y=a.y*(1-t)+b.y*t,z=a.z*(1-t)+b.z*t,len=Math.hypot(x,y,z),px=g.cx+x/len*g.r,py=g.cy+y/len*g.r;k?ctx.lineTo(px,py):ctx.moveTo(px,py);}ctx.stroke();}}
   positionMarkers();
 }
 function positionMarkers(){const g=layout();root.querySelectorAll('[data-region]').forEach(b=>{const s=world().sites[Number(b.dataset.region)];b.style.left=(g.cx+s.x*g.r)+'px';b.style.top=(g.cy+s.y*g.r)+'px';});}
 function render(note=''){const w=world(),e=economy(w),s=w.sites[state.selected],fmt=n=>n.toLocaleString('de-DE',{maximumFractionDigits:1});w.last=state.selected;$('ac-energy').textContent=(e.yields[0]>=0?'+':'')+fmt(e.yields[0]);$('ac-minerals').textContent='+'+fmt(e.yields[1]);$('ac-science').textContent='+'+fmt(e.yields[2]);
   $('ac-worldname').textContent=w.type.name;$('ac-eyebrow').textContent=w.type.system;$('ac-worldtype').textContent=w.type.type+' · '+w.type.habitability+' % bewohnbar';$('ac-worldpops').innerHTML='<b>'+w.pops+' Pops</b> · '+e.available+' ohne Job';$('ac-sectorcount').textContent=w.sites.length+' Sektoren';
   $('ac-markers').innerHTML=w.sites.map((p,i)=>'<button type="button" class="ac-marker '+(p.buildings.length?'':'empty')+' '+(i===state.selected?'selected-tag':'')+'" data-region="'+i+'" data-name="'+p.name+'" data-pops="'+p.employed+'/'+p.jobs+'" aria-label="'+p.name+', '+p.feature+', '+p.employed+' von '+p.jobs+' Jobs besetzt" aria-pressed="'+(i===state.selected)+'"><span aria-hidden="true">'+(p.buildings.length?specs[p.buildings[0]].symbol:'+')+'</span></button>').join('');
   $('ac-sectornumber').textContent='SEKTOR '+String(state.selected+1).padStart(2,'0');$('ac-sectorname').textContent=s.name;$('ac-feature').textContent=s.feature+(s.bonus?' · +20 % '+{mine:'Mineralien',power:'Energie',lab:'Forschung'}[s.bonus]:'');$('ac-used').textContent=s.buildings.length+' / '+s.slots;
   $('ac-districts').innerHTML=s.buildings.map((b,i)=>'<div class="ac-district"><span class="ac-district-symbol" aria-hidden="true">'+specs[b].symbol+'</span><span>'+specs[b].name+'</span><small>'+specs[b].jobs+' Jobs</small><button type="button" data-remove="'+i+'" aria-label="'+specs[b].name+' aus Vorschau entfernen">×</button></div>').join('')+Array.from({length:s.slots-s.buildings.length},()=>'<div class="ac-empty" aria-label="Freier Distriktplatz">+</div>').join('');
   $('ac-jobs').textContent=s.employed+' / '+s.jobs;$('ac-popdots').innerHTML=Array.from({length:s.jobs},(_,i)=>'<span class="ac-popdot '+(i>=s.employed?'vacant':'')+'" aria-hidden="true"></span>').join('');$('ac-popcaption').textContent=s.jobs?(s.jobs-s.employed? (s.jobs-s.employed)+' offene Jobs':'Alle Arbeitsplätze besetzt'):'Noch keine Arbeitsplätze';
   $('ac-build').disabled=s.buildings.length>=s.slots;$('ac-build').hidden=state.building;$('ac-buildchoices').hidden=!state.building;root.querySelectorAll('[data-build]').forEach(b=>b.disabled=s.buildings.length>=s.slots);
   $('ac-sectorpanel').hidden=state.pops;$('ac-popspanel').hidden=!state.pops;$('ac-popbutton').textContent=state.pops?'← Zur Sektorauswahl':'Bevölkerung ansehen →';$('ac-employment').textContent=(w.pops-e.available)+' beschäftigt · '+e.available+' ohne Job';$('ac-housing').textContent=w.pops+' / '+e.housing;
   root.querySelectorAll('[data-policy]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.policy===w.policy)));root.querySelectorAll('[data-world]').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.world)===state.world)));$('ac-note').textContent=note;paint();
 }
 root.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b||!root.contains(b))return;let note='',focus;
   if(b.dataset.world!==undefined){state.world=Number(b.dataset.world);state.selected=world().last;state.building=false;}
   if(b.dataset.region!==undefined){state.selected=Number(b.dataset.region);state.pops=false;state.building=false;focus='[data-region="'+state.selected+'"]';}
   if(b.id==='ac-build'){state.building=true;focus='[data-build="habitat"]';}if(b.id==='ac-popbutton')state.pops=!state.pops;
   const w=world(),s=w.sites[state.selected];if(b.dataset.policy)w.policy=b.dataset.policy;
   if(b.dataset.build&&s.buildings.length<s.slots){s.buildings.push(b.dataset.build);state.building=false;economy(w);note=specs[b.dataset.build].name+' platziert'+(s.employed<s.jobs?' · Arbeitskräfte fehlen':'');focus='#ac-build';}
   if(b.dataset.remove!==undefined){s.buildings.splice(Number(b.dataset.remove),1);note='Distrikt aus Vorschau entfernt';focus='#ac-build';}
   render(note);const target=focus&&root.querySelector(focus);if(target&&!target.disabled)target.focus();else if(focus)root.querySelector('[data-region="'+state.selected+'"]').focus();
 });
 const observer=new ResizeObserver(entries=>{const r=entries[0].contentRect;dimensions={w:r.width,h:r.height};paint();});observer.observe($('ac-space'));render();
 if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{state.selected=0;state.building=false;render();}});tweak.addSlider(state,'variation',{label:'Prozedurale Planetenvariante',min:1,max:99,step:1});tweak.addToggle(state,'contours',{label:'Konturen & Verbindungen'});}
})();
