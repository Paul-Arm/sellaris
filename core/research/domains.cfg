; Research domains (disciplines). Each domain owns a deck of technologies
; declared in core/research/techs/*.cfg. Mods may add domains here or via
; ResearchManager.register_domain_dict() at runtime.
;
; tier_requirements: completed techs in the domain needed to unlock each tier
; (index 0 is tier 0 and must stay 0).
; momentum_*: completing a tech raises momentum for each of its tags; matching
; techs then draft more often (weight bonus) and start cheaper (discount).

[industry]
display_name="Industrie & Materie"
