; Core technology set. Every *.cfg in this directory is loaded and merged, so
; mods add techs by dropping their own file here (later files override earlier
; ids in alphabetical order) or via ResearchManager.register_tech_dict().
;
; cost uses decimal research units (converted to milliunits at load time),
; matching the cost convention in core/economy/buildings/buildings.cfg.
; See core/research/README.md for the full format reference.

